<!DOCTYPE html>
<html>
<head>
<style>
body{
    margin:0;
    font-family:Arial;
}
.dark{
    background:black;
    color:white;
}
header,nav,footer{
    background:gray;
    padding:15px;
    text-align:center;
}
.container{
    display:grid;
    grid-template-columns: 3fr 1fr;
    gap:10px;
    padding:10px;
}
.content,.sidebar{
    border:1px solid black;
    padding:10px;
}
button{
    padding:8px;
}
@media(max-width:600px){
    .container{
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>

<header>
    <h1>My Blog</h1>
    <button onclick="toggleMode()">Dark Mode</button>
</header>

<nav>
    Home | About | Contact
</nav>

<div class="container">
    <div class="content">
        <h2>Blog Post</h2>
        <p>This is blog content area.</p>
    </div>

    <div class="sidebar">
        <h3>Recent Posts</h3>
        <p>Post 1</p>
        <p>Post 2</p>
    </div>
</div>

<footer>
    Copyright 2026
</footer>

<script>
if(localStorage.getItem("mode")=="dark"){
    document.body.classList.add("dark");
}

function toggleMode(){
    document.body.classList.toggle("dark");

    if(document.body.classList.contains("dark"))
        localStorage.setItem("mode","dark");
    else
        localStorage.setItem("mode","light");
}
</script>

</body>
</html>
