<!DOCTYPE html>
<html>
<head>
<style>
table,th,td{
    border:1px solid black;
    border-collapse:collapse;
    padding:5px;
}
.low{
    background:red;
}
</style>
</head>
<body>

<select id="cat" onchange="load()">
    <option value="">All</option>
    <option>Electronics</option>
    <option>Clothing</option>
    <option>Books</option>
</select>

<table>
<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Category</th>
    <th>Price</th>
    <th>Stock</th>
</tr>
<tbody id="data"></tbody>
</table>

<script>
function load(){
    fetch("products.xml")
    .then(r=>r.text())
    .then(str=>{
        let xml=new DOMParser().parseFromString(str,"text/xml");
        let products=xml.getElementsByTagName("product");
        let out="";
        let cat=document.getElementById("cat").value;

        for(let p of products){
            let category=p.getElementsByTagName("category")[0].textContent;
            let stock=parseInt(p.getElementsByTagName("stock")[0].textContent);

            if(cat=="" || cat==category){
                out+=`
                <tr class="${stock<5?'low':''}">
                <td>${p.getElementsByTagName("id")[0].textContent}</td>
                <td>${p.getElementsByTagName("name")[0].textContent}</td>
                <td>${category}</td>
                <td>${p.getElementsByTagName("price")[0].textContent}</td>
                <td>${stock}</td>
                </tr>`;
            }
        }

        data.innerHTML=out;
    });
}
load();
</script>

</body>
</html>
