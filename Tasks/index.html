<!DOCTYPE html>
<html>
<body>

Task: <input type="text" id="task">

<select id="priority">
    <option>Low</option>
    <option>Medium</option>
    <option>High</option>
</select>

<button onclick="addTask()">Add Task</button>

<select id="filter" onchange="show()">
    <option value="">All</option>
    <option>Low</option>
    <option>Medium</option>
    <option>High</option>
</select>

<h3>Completed: <span id="completed">0</span></h3>
<h3>Pending: <span id="pending">0</span></h3>

<ul id="list"></ul>

<script>
let tasks=[];

function addTask(){
    if(task.value=="") return;

    tasks.push({
        name:task.value,
        priority:priority.value,
        done:false
    });

    task.value="";
    show();
}

function show(){
    let f=filter.value;
    let out="";
    let c=0,p=0;

    tasks.forEach((t,i)=>{
        if(f=="" || t.priority==f){
            out+=`
            <li>
            ${t.name} (${t.priority})
            <button onclick="done(${i})">Done</button>
            </li>`;
        }

        if(t.done) c++;
        else p++;
    });

    list.innerHTML=out;
    completed.innerHTML=c;
    pending.innerHTML=p;
}

function done(i){
    tasks[i].done=true;
    show();
}
</script>

</body>
</html>
