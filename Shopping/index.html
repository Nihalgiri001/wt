<!DOCTYPE html>
<html>
<head>
<style>
table,th,td{
    border:1px solid black;
    border-collapse:collapse;
    padding:5px;
}
</style>
</head>
<body>

<table>
<tr>
    <th>Product</th>
    <th>Price</th>
    <th>Qty</th>
    <th>Subtotal</th>
</tr>

<tr><td>Laptop</td><td>50000</td><td><input type="number" id="q1" value="0" oninput="calc()"></td><td id="s1">0</td></tr>
<tr><td>Mouse</td><td>1000</td><td><input type="number" id="q2" value="0" oninput="calc()"></td><td id="s2">0</td></tr>
<tr><td>Keyboard</td><td>2000</td><td><input type="number" id="q3" value="0" oninput="calc()"></td><td id="s3">0</td></tr>
<tr><td>Headphones</td><td>3000</td><td><input type="number" id="q4" value="0" oninput="calc()"></td><td id="s4">0</td></tr>
<tr><td>Speaker</td><td>4000</td><td><input type="number" id="q5" value="0" oninput="calc()"></td><td id="s5">0</td></tr>

</table>

<h3>Grand Total: ₹<span id="grand">0</span></h3>
<h3>Discount: ₹<span id="disc">0</span></h3>
<h3>Final Payable: ₹<span id="final">0</span></h3>

<script>
function calc(){
    let prices=[50000,1000,2000,3000,4000];
    let total=0;

    for(let i=1;i<=5;i++){
        let qty=document.getElementById("q"+i).value;
        let sub=qty*prices[i-1];
        document.getElementById("s"+i).innerHTML=sub;
        total+=sub;
    }

    let discount=total>2000 ? total*0.10 : 0;
    let final=total-discount;

    grand.innerHTML=total;
    disc.innerHTML=discount;
    document.getElementById("final").innerHTML=final;
}
</script>

</body>
</html>
