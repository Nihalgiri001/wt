<!DOCTYPE html>
<html>
<body>

Event Name: <input type="text" id="name"><br><br>
Event Date: <input type="datetime-local" id="date"><br><br>

<button onclick="start()">Start Countdown</button>

<h2 id="event"></h2>
<h2 id="timer"></h2>

<script>
let x;

function start(){
    let eventName=name.value;
    let eventDate=new Date(date.value).getTime();

    event.innerHTML=eventName;

    x=setInterval(function(){
        let now=new Date().getTime();
        let diff=eventDate-now;

        if(diff<=0){
            clearInterval(x);
            timer.innerHTML="Event Started";
            return;
        }

        let days=Math.floor(diff/(1000*60*60*24));
        let hours=Math.floor((diff%(1000*60*60*24))/(1000*60*60));
        let mins=Math.floor((diff%(1000*60*60))/(1000*60));
        let secs=Math.floor((diff%(1000*60))/1000);

        timer.innerHTML=days+" Days "+hours+" Hours "+mins+" Minutes "+secs+" Seconds";
    },1000);
}
</script>

</body>
</html>
